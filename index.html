<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Impact Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-danger: #fef2f2;
      --text: #111111;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border: rgba(0,0,0,0.1);
      --border-light: rgba(0,0,0,0.06);
      --accent: #22c55e;
      --accent-warn: #f97316;
      --accent-danger: #dc2626;
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --bg-danger: #3b0a0a;
        --text: #f5f5f5;
        --text-secondary: #9ca3af;
        --text-tertiary: #6b7280;
        --border: rgba(255,255,255,0.1);
        --border-light: rgba(255,255,255,0.06);
      }
    }

    html, body {
      width: 300px;
      height: 350px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .widget {
      width: 300px;
      height: 350px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
    }

    /* ── Title bar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 0.5px solid var(--border-light);
      -webkit-app-region: drag;
      cursor: grab;
      flex-shrink: 0;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f91616;
      flex-shrink: 0;
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .close-btn {
      -webkit-app-region: no-drag;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 0.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text-tertiary);
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    .close-btn:hover { background: var(--bg-secondary); color: var(--text); }

    /* ── Body ── */
    .body {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    /* ── Status row ── */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-tertiary);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .pulse-dot.active {
      background: var(--accent);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hits-badge {
      font-size: 12px;
      color: var(--text-tertiary);
      background: var(--bg-secondary);
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 500;
    }

    /* ── Volume ── */
    .section { display: flex; flex-direction: column; gap: 8px; }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .volume-track {
      width: 100%;
      height: 5px;
      background: var(--bg-secondary);
      border-radius: 99px;
      overflow: hidden;
    }

    .volume-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      width: 0%;
      transition: width 0.07s ease-out, background 0.18s ease;
    }

    /* ── Sensitivity slider ── */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="range"] {
      flex: 1;
      height: 5px;
      -webkit-appearance: none;
      background: var(--bg-secondary);
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--text);
      border: 2.5px solid var(--bg);
      box-shadow: 0 0 0 1.5px var(--border);
      cursor: pointer;
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }

    .slider-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      min-width: 30px;
      text-align: right;
      letter-spacing: -0.02em;
    }

    /* ── Toggle button ── */
    .toggle-btn {
      width: 100%;
      padding: 11px;
      border-radius: 9px;
      border: 0.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      transition: background 0.15s, transform 0.1s, border-color 0.15s, color 0.15s;
    }
    .toggle-btn:hover { background: var(--bg-secondary); }
    .toggle-btn:active { transform: scale(0.98); }

    .toggle-btn.is-listening {
      background: var(--bg-danger);
      color: var(--accent-danger);
      border-color: rgba(220, 38, 38, 0.25);
    }
    .toggle-btn.is-listening:hover { background: #fee2e2; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="titlebar">
      <div class="title-left">
        <div class="dot"></div>
        <span class="app-name">slappy</span>
      </div>
      <button class="close-btn" id="close-btn">✕</button>
    </div>

    <div class="body">
      <div class="status-row">
        <div class="status-badge">
          <div class="pulse-dot" id="pulse-dot"></div>
          <span class="status-text" id="status-text">Idle</span>
        </div>
        <span class="hits-badge" id="hits-badge">0 hits</span>
      </div>

      <div class="section">
        <span class="label">Volume</span>
        <div class="volume-track">
          <div class="volume-fill" id="vol-fill"></div>
        </div>
      </div>

      <div class="section">
        <span class="label">Sensitivity</span>
        <div class="slider-row">
          <input type="range" id="sens-slider" min="1.5" max="5" step="0.1" value="2.5" />
          <span class="slider-val" id="sens-val">2.5</span>
        </div>
      </div>

      <button class="toggle-btn" id="toggle-btn">Start Listening</button>
    </div>
  </div>

  <script src="render.js"></script>
</body>
</html>
